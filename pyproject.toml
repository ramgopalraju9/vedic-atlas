[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veda"
version = "0.1.0"
description = "Veda - personal offline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "psutil>=5.9",
    # CLI client
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]


[project.scripts]
veda = "controller.cli.__main__:main"