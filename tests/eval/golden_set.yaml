# Golden set for the tool harness.
#   agent: where the supervisor must route the message (deterministic, checked in CI).
#   tool:  the tool the model must choose (checked by scripts/eval_tools.py --model);
#          null = the model must return no call and the turn falls back to chat.
#   args:  subset the model's arguments must contain (strings compared case-insensitively, substring).

# ---- tasks -------------------------------------------------------------------
- {say: "I need to bring vegies", agent: tasks, tool: tasks, args: {action: add, title: vegies}}
- {say: "I need to code", agent: tasks, tool: tasks, args: {action: add, title: code}}
