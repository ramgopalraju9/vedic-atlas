# ---- remember: lasting facts the user states about themselves --------------------------------------------
- {say: "my favourite sweet is gulab jamun", agent: memory, tool: remember, args: {action: save, topic: sweet, value: gulab}}
- {say: "my most fav noodles is maggiee", agent: memory, tool: remember, args: {action: save, topic: noodles, value: maggi}}
- {say: "remember that I'm allergic to peanuts", agent: memory, tool: remember, args: {action: save, value: peanuts}}
- {say: "my dog's name is Rex", agent: memory, tool: remember, args: {action: save, value: Rex}}
- {say: "forget my favourite sweet", agent: memory, tool: remember, args: {action: forget, topic: sweet}}
- {say: "what do you remember about me?", agent: memory, tool: remember, args: {action: list}}
# questions about a saved fact are answered from the prompt, not by a tool call
- {say: "what is my favourite food?", agent: responder, tool: null}
- {say: "and my dessert?", agent: responder, tool: null}

# ---- must NOT be hijacked by the broader search patterns ----
- {say: "I'm so tired this week", agent: responder, tool: null}
- {say: "tell me a story about a dragon", agent: responder, tool: null}
- {say: "what is the best way to learn guitar", agent: responder, tool: null}

# ---- phrasings with NO trigger words: only the LLM router can send these to the right agent (llm: true) ----
