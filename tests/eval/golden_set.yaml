# Golden set for the tool harness.
#   agent: where the supervisor must route the message (deterministic, checked in CI).
#   tool:  the tool the model must choose (checked by scripts/eval_tools.py --model);
#          null = the model must return no call and the turn falls back to chat.
#   args:  subset the model's arguments must contain (strings compared case-insensitively, substring).

# ---- tasks -------------------------------------------------------------------
- {say: "I need to bring vegies", agent: tasks, tool: tasks, args: {action: add, title: vegies}}
- {say: "I need to code", agent: tasks, tool: tasks, args: {action: add, title: code}}
- {say: "remind me to call mom tomorrow", agent: tasks, tool: tasks, args: {action: add, title: call mom}}
- {say: "add buy milk to my tasks", agent: tasks, tool: tasks, args: {action: add, title: milk}}
- {say: "don't forget to pay the electricity bill", agent: tasks, tool: tasks, args: {action: add, title: electricity}}
- {say: "yeah I bought the milk packets", agent: tasks, tool: tasks, args: {action: complete, title: milk}}
- {say: "I finished the code review", agent: tasks, tool: tasks, args: {action: complete, title: code review}}
- {say: "I already paid the electricity bill", agent: tasks, tool: tasks, args: {action: complete, title: electricity}}
- {say: "what are my tasks?", agent: tasks, tool: tasks, args: {action: list}}
- {say: "what do I need to do today?", agent: tasks, tool: tasks, args: {action: list}}
- {say: "show my to-do list", agent: tasks, tool: tasks, args: {action: list}}
- {say: "what tasks have I completed?", agent: tasks, tool: tasks, args: {action: list, include_done: true}}
- {say: "forget the bank thing", agent: responder, tool: null}
- {say: "delete the task about the dentist", agent: tasks, tool: tasks, args: {action: delete, title: dentist}}

