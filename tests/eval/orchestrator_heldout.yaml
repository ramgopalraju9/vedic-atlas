# ---- live data with no tool ----------------------------------------------------------------------
- {say: "what's the latest cricket score", category: explicit, expect: {calls: [{tool: web_search, args: {query: cricket}}]}}
# was no-tool until the calendar and mail tools existed (2026-10-08); the expectation follows the tool set, the phrasing is unchanged
- {say: "do i have a meeting this afternoon", category: google, expect: {calls: [{tool: calendar_agenda}]}}
- {say: "what mail came in this morning", category: google, expect: {calls: [{tool: gmail_search}]}}

# ---- no active state -----------------------------------------------------------------------------
- {say: "and what about the weekend", category: no-state, expect: {calls: [], clarification: true}}
- {say: "how about in euros", category: no-state, expect: {calls: [], clarification: true}}
- {say: "mark it as done", category: no-state, expect: {calls: [], clarification: true}}

# ---- multi-intent --------------------------------------------------------------------------------
- {say: "what's the weather in Surat and also convert fifty dollars to rupees", category: multi, expect: {calls: [{tool: get_weather, args: {place: Surat}}, {tool: convert_currency, args: {amount: 50}}]}}
- {say: "add pay rent to my tasks and tell me the weather in Nagpur", category: multi, expect: {calls: [{tool: tasks, args: {action: add, title: rent}}, {tool: get_weather, args: {place: Nagpur}}]}}

# ---- destructive ---------------------------------------------------------------------------------
- say: "remove that one"
  category: destructive
  history: [{user: "list my tasks", veda: "You have 3 tasks: water plants, book tickets, pay rent."}]
  expect: {calls: [], clarification: true}
- say: "delete the book tickets task"
  category: destructive
  expect: {calls: [{tool: tasks, args: {action: delete, title: tickets}}]}
- say: "forget that"
  category: destructive
  history: [{user: "i like jazz", veda: "Saved: you like jazz."}, {user: "i hate cilantro", veda: "Saved: you dislike cilantro."}]
  expect: {calls: [], clarification: true}

# ---- slot guard ----------------------------------------------------------------------------------
- {say: "what's it like in Ooty today", category: slot-guard, expect: {calls: [{tool: get_weather, args: {place: Ooty}}]}}
- say: "try Shillong"
  category: slot-guard
  history: [{user: "weather in Kochi", veda: "In Kochi it's 29 degrees and humid."}]
  state: {tool: get_weather, slots: {place: Kochi}}
  expect: {calls: [{tool: get_weather, args: {place: Shillong}}]}

# ---- pending clarification answered --------------------------------------------------------------
- say: "the first one"
  category: pending
  history: [{user: "delete a task", veda: "Which task do you mean?"}]
  state: {tool: tasks, slots: {}, pending: {tool: tasks, partial_args: {action: delete}, awaiting: title, candidates: [water plants, book tickets, pay rent]}}
  expect: {calls: [{tool: tasks, args: {action: delete, title: water}}]}
# ---- calendar writes, the clock and sent mail (added with calendar_create / current_time / gmail_search folder) ----
- {say: "add lunch with Priya to my calendar tomorrow at 1 pm", category: calendar-write, expect: {calls: [{tool: calendar_create, args: {title: lunch, date_offset: 1, time: "13:00"}}]}}
- {say: "create a meeting called budget review on my calendar today at 4:30 pm", category: calendar-write, expect: {calls: [{tool: calendar_create, args: {title: budget, date_offset: 0, time: "16:30"}}]}}
- {say: "do I have anything on my calendar tomorrow", category: calendar-write, expect: {calls: [{tool: calendar_agenda, args: {date_offset: 1}}]}}
- {say: "tell me the time", category: clock, expect: {calls: [{tool: current_time, args: {}}]}}
- {say: "which day is it today", category: clock, expect: {calls: [{tool: current_time, args: {what: date}}]}}
- {say: "show me the emails I sent to Priya", category: google, expect: {calls: [{tool: gmail_search, args: {folder: sent}}]}}
