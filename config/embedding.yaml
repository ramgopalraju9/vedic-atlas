enabled: true

# FastEmbed model id. Keep this when using FastEmbed's normal model lookup,
# or set model_path below to a local embedding model directory under data/.
model_id: BAAI/bge-small-en-v1.5

# Local embedding model directory (staged under data/).
model_path: data/bge-small-en-v1.5

# Cache/download location used by FastEmbed when model_path is not set.
cache_dir: data/embeddings

# Number of semantically relevant facts to inject into context once retrieval is enabled.
top_k: 5

# Minimum cosine similarity (0..1) for a memory to be injected.
min_score: 0.3

# Memory sources semantic recall searches.
sources:
  - fact
  - summary