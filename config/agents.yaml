# When true, a specialist agent is registered for every owner named in config/tools/*.yaml
# (tasks, lookup, ...). Each runs its tools through the staged tool turn: constrained JSON
# call -> guarded execution -> reply. Routing, prompts and guard rules come from the manifests.
tools_enabled: true

supervisor:
  enabled: true
  model: null
  description: Routes requests to specialist agents

responder:
  enabled: true
  model: null
  description: General conversation, Q&A, brainstorming

system:
  enabled: true
  model: null
  description: "Device actions: open/close apps, volume, running processes"
  skills:
    - terminal
    - file_ops