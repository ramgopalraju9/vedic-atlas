# Fast-device profile: Qwen3-0.6B. Use with  VEDA_PROFILE=qwen3-0.6b
# (PowerShell: $env:VEDA_PROFILE="qwen3-0.6b"). Keys override config/<section>.yaml; unset = the base (4B) values.
inference:
  model_path: data/Qwen3-0.6B-Q4_K_M.gguf
  n_ctx: 3072
  # The control decode's static prompt (persona + every tool + rules/examples) is ~2,200 estimated tokens, so 2048 can
  # no longer hold it. 3072 holds it plus history, the question and the 200-token decision (test_profiles_fit_the_control_prompt).
  num_predict: 80
app:
  max_history: 4       # prompt prefill dominates CPU latency; voice turns rarely need more
  chat_summaries: 0    # earlier-session summaries were ~450 tokens of unrelated text in every chat prompt
  chat_persona: compact  # ~250-token persona instead of the full ~560-token one
embedding:
  top_k: 1             # semantic recall: at most one memory, and only a strong match
  min_score: 0.55      # right memories score 0.53-0.72 on bge-small, so a higher floor would miss some
prompting:
  budgets:
    control: 2800      # n_ctx 3072 minus the 200-token decision and a margin; history is trimmed first to fit (shallow merge: other budgets keep their defaults)
