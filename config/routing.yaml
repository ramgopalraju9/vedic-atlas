# How a message is mapped to a specialist agent (tasks / lookup / memory / system / responder).
#
#   mode: keyword   manifest trigger regexes + word overlap only. Instant. The router model is never loaded.
#   mode: model     a small dedicated model (Qwen3-0.6B) decides EVERY message; the keyword rules are only the
#                   fallback when it cannot answer (timeout, error, missing model file).
#   mode: hybrid    keyword rules decide when SURE (exactly one agent's trigger matched and the sentence has no
#                   "I didn't ask about..." style correction); the router model decides everything else.
#
# Switch by changing `mode` and restarting. The startup log prints "[config] ... routing=<mode>" and every routed
# message logs "[route] mode=... via=... agent=...".
mode: hybrid

# When the router cannot answer: keyword = fall back to the keyword rules (default), chat = go straight to chat.
on_failure: keyword

# The router model. Runs one tiny constrained call per message ({"agent": "<name>"}), before the main LLM is used.
model:
  # null = use the main LLM for routing instead (no extra RAM, but slower on a small device).
  model_path: data/Qwen3-0.6B-Q4_K_M.gguf
  n_ctx: 2560
  n_threads: null
  timeout_sec: 8.0        # how long the model may RUN for one routing call. A call that is too slow pauses model
                          # routing for 10 min (keyword rules meanwhile). Time spent queued behind the main model
                          # does not count.
  queue_wait_sec: 30.0    # how long a routing call may wait behind the main model before this message is skipped
  num_predict: 16
  prompt_cache_mb: 64
